<h2>Liste des conférences</h2>

<div class="conference-list">

  @for (conference of conferences; track conference.title) {

    <div class="conference-card">

      <h3>{{ conference.title | uppercase }}</h3>

      <p>
        {{ conference.description }}
      </p>

      <p>
        <strong>Date :</strong>
        {{ conference.date | date:'dd/MM/yyyy' }}
      </p>

      <p>
        <strong>Lieu :</strong>
        {{ conference.place }}
      </p>

      <button (click)="selectConference(conference)">
        Voir les détails
      </button>

    </div>

  } @empty {

    <p>Aucune conférence disponible.</p>

  }

</div>
